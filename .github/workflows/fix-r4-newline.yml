name: Fix R4 newline literal

on:
  push:
    branches: [ feat/r4-unified-microscope ]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r4-unified-microscope

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair Java newline literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/qujindai/facelivtlab/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          bad = "results.append('\n');"
          good = "results.append('\\n');"
          if bad not in s:
              raise SystemExit('broken newline literal anchor not found')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java
          git rm .github/workflows/fix-r4-newline.yml
          git commit -m "fix: repair R4 recognition result newline"
          git push origin HEAD:feat/r4-unified-microscope
