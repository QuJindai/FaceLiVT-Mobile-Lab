name: Android APK

on:
  push:
    branches: [ main, feat/r2-big-validation, fix/r2-ui-safe-area, feat/r3-face-microscope, feat/r31-calibration-microscope, fix/r32-model-microscope-linkage ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify handset UI contract
        run: python tools/verify_ui_contract.py

      - name: Verify R3 microscope contract
        run: python tools/verify_r3_microscope.py

      - name: Verify R3.1 calibration contract
        run: python tools/verify_r31_calibration.py

      - name: Verify R3.2 model microscope linkage
        run: python tools/verify_model_microscope_linkage.py

      - name: Install model export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install timm==1.0.15 onnx==1.17.0 onnxruntime==1.20.1 huggingface_hub==0.35.3 numpy==1.26.4

      - name: Fetch pinned FaceLiVT upstream
        run: |
          git clone https://github.com/novendrastywn/FaceLiVT.git upstream-facelivt
          cd upstream-facelivt
          git checkout d99d86607c7c05540c74e815e5a88847f7e667db

      - name: Export FaceLiVTv2 XS S M and verify fidelity
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python tools/export_facelivtv2.py --variant xs --upstream upstream-facelivt --output app/src/main/assets/facelivtv2_xs.onnx
          python tools/export_facelivtv2.py --variant s  --upstream upstream-facelivt --output app/src/main/assets/facelivtv2_s.onnx
          python tools/export_facelivtv2.py --variant m  --upstream upstream-facelivt --output app/src/main/assets/facelivtv2_m.onnx
          ls -lh app/src/main/assets/facelivtv2_*.onnx

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify R3.2 APK contents and ABI
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          APK=FaceLiVT-Mobile-Lab-R3.2-debug.apk
          cp "$SRC" "$APK"
          CONTENTS="$(unzip -Z1 "$APK")"
          for model in facelivtv2_xs.onnx facelivtv2_s.onnx facelivtv2_m.onnx; do
            echo "$CONTENTS" | grep -qx "assets/$model" || { echo "missing assets/$model"; exit 1; }
          done
          echo "$CONTENTS" | grep -q '^lib/arm64-v8a/' || { echo "arm64-v8a native libs missing"; exit 1; }
          BAD_ABI="$(echo "$CONTENTS" | grep '^lib/' | grep -v '^lib/arm64-v8a/' || true)"
          if [ -n "$BAD_ABI" ]; then
            echo "unexpected native ABI entries:"
            echo "$BAD_ABI"
            exit 1
          fi
          sha256sum "$APK"
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: FaceLiVT-Mobile-Lab-R3.2-debug-apk
          path: FaceLiVT-Mobile-Lab-R3.2-debug.apk
          if-no-files-found: error
          retention-days: 30
