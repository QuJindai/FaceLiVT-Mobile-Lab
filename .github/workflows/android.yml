name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install model export toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0
          python -m pip install timm==1.0.15 onnx==1.17.0 onnxruntime==1.20.1 huggingface_hub==0.35.3 numpy==1.26.4

      - name: Fetch pinned FaceLiVT upstream
        run: |
          git clone https://github.com/novendrastywn/FaceLiVT.git upstream-facelivt
          cd upstream-facelivt
          git checkout d99d86607c7c05540c74e815e5a88847f7e667db

      - name: Export FaceLiVTv2-S to ONNX and verify fidelity
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python tools/export_facelivtv2.py --upstream upstream-facelivt --output app/src/main/assets/facelivtv2_s.onnx
          ls -lh app/src/main/assets/facelivtv2_s.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests and APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: APK metadata
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaceLiVT-Mobile-Lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
