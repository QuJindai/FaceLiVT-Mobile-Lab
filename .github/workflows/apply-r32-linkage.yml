name: Apply R3.2 linkage patch

on:
  push:
    branches: [ fix/r32-model-microscope-linkage ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r32-model-microscope-linkage

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic linkage patch
        run: python tools/apply_model_microscope_linkage.py

      - name: Verify patch shape
        run: |
          python tools/verify_model_microscope_linkage.py
          git diff --check

      - name: Commit patched production code
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java
          git commit -m "fix: link model selection to microscope"
          git push origin HEAD:fix/r32-model-microscope-linkage
