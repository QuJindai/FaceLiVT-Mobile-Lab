name: R5.2 Guard Deep Stability Patch

on:
  push:
    branches: [ fix/r52-guard-deep-flicker ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r52-guard-deep-flicker

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply idempotent EXISTING transition patch
        run: python tools/apply_r52_guard_deep_stability.py

      - name: Verify R5.2 stability regression contract locally
        run: python tools/verify_r52_guard_deep_stability.py

      - name: Commit product fix and remove one-shot helpers
        run: |
          rm tools/apply_r52_guard_deep_stability.py
          rm .github/workflows/r52-guard-deep-stability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java tools/apply_r52_guard_deep_stability.py .github/workflows/r52-guard-deep-stability-patch.yml
          git commit -m "fix: keep Guard deep microscope stable for existing identity"
          git push origin HEAD:fix/r52-guard-deep-flicker
