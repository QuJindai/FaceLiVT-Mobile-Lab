name: Apply R4 integration patch

on:
  push:
    branches: [ feat/r4-deep-microscope ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r4-deep-microscope

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic R4 integration patch
        run: python tools/apply_r4_integration.py

      - name: Verify R4 source contract and whitespace
        run: |
          python tools/verify_r4_microscope.py
          git diff --check

      - name: Commit integrated production code
        run: |
          if git diff --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java app/src/main/java/com/qujindai/facelivtlab/SessionLogger.java app/src/main/res/layout/activity_main.xml
          git commit -m "feat: integrate R4 deep face microscope"
          git push origin HEAD:feat/r4-deep-microscope
