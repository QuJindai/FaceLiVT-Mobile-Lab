name: R5 Capture Identity Safety Patch

on:
  push:
    branches: [ feat/r5-identity-guard-history ]
    paths:
      - '.github/workflows/r5-capture-identity-safety.yml'
      - 'tools/apply_r5_capture_identity_safety.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5-identity-guard-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply in-capture identity safety patch
        run: python tools/apply_r5_capture_identity_safety.py
      - name: Verify source ordering
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/qujindai/facelivtlab/MainActivity.java').read_text()
          hs=s.index('private void handleEnrollment(')
          he=s.index('private void finalizeEnrollment(', hs)
          h=s[hs:he]
          add=h.index('enrollmentSession.add(')
          assert h.index('EnrollmentIdentityLock.forNewIdentity(') < add
          assert h.index('EnrollmentIdentityLock.forAppend(') < add
          assert h.index('enrollmentSession.isSameSubjectCandidate(') < add
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java
          git commit -m "fix: lock identity throughout R5 five-frame capture"
          git push origin HEAD:feat/r5-identity-guard-history
