name: R5.1 Guard Deep Microscope Patch

on:
  push:
    branches: [ fix/r51-guard-deep-microscope ]
    paths:
      - tools/apply_r51_guard_deep_microscope.py
      - .github/workflows/r51-guard-deep-microscope-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r51-guard-deep-microscope
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply focused Guard deep diagnostic patch
        run: python tools/apply_r51_guard_deep_microscope.py
      - name: Verify R5.1 regression contract locally
        run: python tools/verify_r51_guard_deep_microscope.py
      - name: Commit product fix and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java
          git rm tools/apply_r51_guard_deep_microscope.py .github/workflows/r51-guard-deep-microscope-patch.yml
          git commit -m "fix: feed Guard frames into focused deep microscope"
          git push origin HEAD:fix/r51-guard-deep-microscope
