name: Apply R4 wiring patch

on:
  push:
    branches: [ feat/r4-unified-microscope ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r4-unified-microscope

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply deterministic R4 wiring
        run: python tools/apply_r4_main_wiring.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit production wiring and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/qujindai/facelivtlab/MainActivity.java
          git rm .github/workflows/apply-r4-wiring.yml tools/apply_r4_main_wiring.py
          git commit -m "feat: wire R4 unified face microscope"
          git push origin HEAD:feat/r4-unified-microscope
