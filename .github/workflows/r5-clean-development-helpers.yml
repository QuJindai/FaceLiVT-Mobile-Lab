name: R5 Clean Development Helpers

on:
  push:
    branches: [ feat/r5-identity-guard-history ]
    paths:
      - '.github/workflows/r5-clean-development-helpers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r5-identity-guard-history
      - name: Remove one-shot development helpers
        run: |
          git rm -f \
            tools/apply_r5_main_integration.py \
            .github/workflows/r5-apply-main-integration.yml \
            tools/apply_r5_doctor_repairs.py \
            .github/workflows/r5-doctor-repair.yml \
            tools/apply_r5_atomic_commit.py \
            .github/workflows/r5-atomic-commit.yml \
            .github/workflows/r5-clean-development-helpers.yml
      - name: Verify only production workflows remain
        run: |
          test ! -e tools/apply_r5_main_integration.py
          test ! -e tools/apply_r5_doctor_repairs.py
          test ! -e tools/apply_r5_atomic_commit.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove R5 one-shot development helpers"
          git push origin HEAD:feat/r5-identity-guard-history
